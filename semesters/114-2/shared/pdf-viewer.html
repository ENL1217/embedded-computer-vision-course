<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教材檢視 ｜ 嵌入式電腦視覺系統</title>
  <link rel="stylesheet" href="css/course.css">
  <script>
    // Library 載入狀態追蹤 (給 timeout 判斷用)
    window._pdfLibLoaded = false;
    window._pdfLibError = null;
  </script>
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"
          onload="window._pdfLibLoaded = true;"
          onerror="window._pdfLibError = 'unpkg CDN 連不到';"></script>
  <style>
    body { background: #1a2435; margin: 0; padding: 0; }
    .viewer-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #132033;
      color: #fff;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid #2c3e50;
    }
    .viewer-title {
      font-weight: 700;
      font-size: 15px;
      color: #d9e5ef;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 50vw;
    }
    .viewer-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .vbtn {
      background: #1f2f47;
      color: #d9e5ef;
      border: 1px solid #2c4263;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      min-height: 32px;
    }
    .vbtn:hover { background: #2c4263; }
    .vbtn:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-indicator {
      color: #b7d7d7;
      font-size: 14px;
      padding: 0 8px;
    }
    .page-indicator input {
      width: 50px;
      padding: 4px 6px;
      border: 1px solid #2c4263;
      background: #1f2f47;
      color: #fff;
      border-radius: 4px;
      text-align: center;
      font-size: 14px;
    }
    main.viewer-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: calc(100vh - 120px);
    }
    canvas#pdf-canvas {
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      background: #fff;
      max-width: 100%;
      height: auto;
    }
    .loading {
      color: #b7d7d7;
      padding: 40px;
      text-align: center;
    }
    .error {
      color: #ff8a80;
      padding: 40px;
      text-align: center;
      max-width: 600px;
    }
    footer.viewer-footer {
      background: #132033;
      color: #b7d7d7;
      padding: 12px 20px;
      text-align: center;
      font-size: 13px;
      border-top: 1px solid #2c3e50;
    }
    @media (max-width: 720px) {
      .viewer-title { max-width: 100%; flex-basis: 100%; }
      .viewer-controls { flex-basis: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="viewer-bar">
    <div class="viewer-title" id="filename">載入中...</div>
    <div class="viewer-controls">
      <button class="vbtn" id="prev" title="上一頁 (←)">← 上一頁</button>
      <span class="page-indicator">
        <input type="number" id="page-input" min="1" value="1"> / <span id="page-count">-</span>
      </span>
      <button class="vbtn" id="next" title="下一頁 (→)">下一頁 →</button>
      <button class="vbtn" id="zoom-out" title="縮小">−</button>
      <button class="vbtn" id="zoom-in" title="放大">+</button>
      <button class="vbtn" id="fit-width" title="符合寬度">⇔ 符合寬度</button>
    </div>
  </div>

  <main class="viewer-main">
    <div id="content" class="loading">⏳ 載入 PDF 中...</div>
    <canvas id="pdf-canvas" style="display:none;"></canvas>
  </main>

  <footer class="viewer-footer">
    嵌入式電腦視覺系統 ｜ 114-2 ｜ 本教材限本課程修課學生使用 ｜ 禁止外流
  </footer>

  <script>
    const params = new URLSearchParams(location.search);
    const file = params.get('file');
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const content = document.getElementById('content');

    let pdfDoc = null;
    let pageNum = 1;
    let scale = 1.5;
    let isRendering = false;
    let pendingPage = null;

    function setStatus(text) {
      content.innerHTML = text;
    }

    function showError(html) {
      content.className = 'error';
      content.innerHTML = html;
    }

    // 先檢查 library 載入狀況 (5 秒)
    function waitForLibrary(retries) {
      if (window._pdfLibError) {
        showError('❌ PDF.js library 無法載入<br><br>' +
                  '<code>' + window._pdfLibError + '</code><br><br>' +
                  '可能原因:網路問題、防火牆擋 CDN、或瀏覽器離線。<br>' +
                  '<a href="' + file + '" target="_blank" style="color:#7dd3fc;">改用瀏覽器直接開啟 PDF (Layer 1 失效)</a>');
        return false;
      }
      if (typeof pdfjsLib !== 'undefined') return true;
      if (retries <= 0) {
        showError('❌ PDF.js library 載入逾時 (5 秒)<br><br>' +
                  '可能原因:CDN <code>unpkg.com</code> 連不到。<br>' +
                  '<a href="' + file + '" target="_blank" style="color:#7dd3fc;">改用瀏覽器直接開啟 PDF (Layer 1 失效)</a>');
        return false;
      }
      setStatus('⏳ 等待 PDF.js library (' + retries + ')...');
      setTimeout(() => waitForLibrary(retries - 1), 500);
      return null; // pending
    }

    if (!file) {
      content.className = 'error';
      content.textContent = '⚠️ 沒有指定檔案 (網址缺少 ?file=... 參數)';
    } else {
      const filename = decodeURIComponent(file.split('/').pop());
      document.getElementById('filename').textContent = filename;
      document.title = filename + ' ｜ 教材檢視';

      // 偵測 file:// 協定 (本地開啟,PDF.js 會被 CORS 擋)
      const isLocalFile = location.protocol === 'file:';

      if (isLocalFile) {
        // Fallback: 直接用 <embed> 開啟,雖然失去 Layer 1 但本地 dev 可看
        document.querySelector('.viewer-controls').style.display = 'none';
        content.style.display = 'none';
        canvas.style.display = 'none';
        const main = document.querySelector('main.viewer-main');
        main.style.padding = '0';
        const embed = document.createElement('embed');
        embed.src = file + '#toolbar=0&navpanes=0';
        embed.type = 'application/pdf';
        embed.style.cssText = 'width:100%; height:calc(100vh - 110px); border:0;';
        main.appendChild(embed);

        const notice = document.createElement('div');
        notice.style.cssText = 'background:#fff8e6; color:#4f3b13; padding:10px 18px; border-bottom:1px solid #e0c068; font-size:13px; text-align:center;';
        notice.innerHTML = '⚠️ 偵測到 <code>file://</code> 本地開啟 — 使用瀏覽器內建 PDF viewer (Layer 1 保護失效)。<br>' +
                          '部署到 GitHub Pages 後會自動切換為 PDF.js viewer (含 Layer 1)。<br>' +
                          '本地完整測試:<code>cd embedded-computer-vision-course &amp;&amp; python -m http.server 8000</code> 然後開 <code>http://localhost:8000/</code>';
        document.body.insertBefore(notice, document.querySelector('.viewer-bar').nextSibling);
        return;
      }

      // 正常路徑:PDF.js (HTTPS / localhost)
      // 先確認 library 已載入
      const check = waitForLibrary(10);
      if (check === false) return;  // library 載入失敗
      if (check === null) {
        // pending: library 還在載入中,等 callback
        // 用 polling 等到 library load 完才往下走
        const waitTimer = setInterval(() => {
          if (typeof pdfjsLib !== 'undefined') {
            clearInterval(waitTimer);
            actuallyLoadPDF();
          } else if (window._pdfLibError) {
            clearInterval(waitTimer);
            showError('❌ PDF.js library 載入失敗:<code>' + window._pdfLibError + '</code>');
          }
        }, 200);
        // 給 8 秒總 timeout
        setTimeout(() => {
          clearInterval(waitTimer);
          if (typeof pdfjsLib === 'undefined') {
            showError('❌ PDF.js library 載入逾時<br><br>' +
                      '<a href="' + file + '" target="_blank" style="color:#7dd3fc;">改用瀏覽器直接開啟 PDF (Layer 1 失效)</a>');
          }
        }, 8000);
        return;
      }
      actuallyLoadPDF();

      function actuallyLoadPDF() {
        // 設定 worker (用相同 CDN 的 worker 檔)
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

        setStatus('⏳ 開始載入 PDF...');

        // 8 秒 timeout
        let timedOut = false;
        const loadTimeout = setTimeout(() => {
          timedOut = true;
          showError('❌ PDF 載入逾時 (8 秒)<br><br>' +
                    '可能原因:檔案太大、PDF.js worker 卡住、或網路不穩。<br>' +
                    '<a href="' + file + '" target="_blank" style="color:#7dd3fc;">改用瀏覽器直接開啟 PDF</a>');
        }, 8000);

        pdfjsLib.getDocument(file).promise
          .then(pdf => {
            if (timedOut) return;
            clearTimeout(loadTimeout);
            pdfDoc = pdf;
            document.getElementById('page-count').textContent = pdf.numPages;
            document.getElementById('page-input').max = pdf.numPages;
            content.style.display = 'none';
            canvas.style.display = 'block';
            // 起手用「符合寬度」
            fitWidth();
          })
          .catch(err => {
            if (timedOut) return;
            clearTimeout(loadTimeout);
            console.error('PDF load error:', err);
            showError('❌ 無法載入 PDF<br><br><code>' + (err.message || err) + '</code><br><br>' +
                      '<a href="' + file + '" target="_blank" style="color:#7dd3fc;">改用瀏覽器直接開啟 PDF</a>');
          });
      }
    }

    function renderPage(num) {
      if (isRendering) {
        pendingPage = num;
        return;
      }
      isRendering = true;
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const renderCtx = { canvasContext: ctx, viewport };
        page.render(renderCtx).promise.then(() => {
          isRendering = false;
          document.getElementById('page-input').value = num;
          if (pendingPage !== null) {
            const p = pendingPage;
            pendingPage = null;
            renderPage(p);
          }
        });
      });
    }

    function goPrev() {
      if (pageNum > 1) { pageNum--; renderPage(pageNum); }
    }
    function goNext() {
      if (pageNum < pdfDoc.numPages) { pageNum++; renderPage(pageNum); }
    }
    function zoomIn() {
      scale *= 1.2;
      renderPage(pageNum);
    }
    function zoomOut() {
      scale /= 1.2;
      renderPage(pageNum);
    }
    function fitWidth() {
      if (!pdfDoc) return;
      pdfDoc.getPage(pageNum).then(page => {
        const viewport = page.getViewport({ scale: 1 });
        const main = document.querySelector('main.viewer-main');
        scale = (main.clientWidth - 40) / viewport.width;
        renderPage(pageNum);
      });
    }

    document.getElementById('prev').addEventListener('click', goPrev);
    document.getElementById('next').addEventListener('click', goNext);
    document.getElementById('zoom-in').addEventListener('click', zoomIn);
    document.getElementById('zoom-out').addEventListener('click', zoomOut);
    document.getElementById('fit-width').addEventListener('click', fitWidth);

    document.getElementById('page-input').addEventListener('change', e => {
      const n = parseInt(e.target.value);
      if (n >= 1 && n <= pdfDoc.numPages) {
        pageNum = n;
        renderPage(pageNum);
      }
    });

    document.addEventListener('keydown', e => {
      if (!pdfDoc) return;
      // 不在 input 內才響應
      if (document.activeElement.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goPrev(); }
      else if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); goNext(); }
      else if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomIn(); }
      else if (e.key === '-') { e.preventDefault(); zoomOut(); }
    });

    // 禁右鍵 (Layer 1)
    document.addEventListener('contextmenu', e => e.preventDefault());
    // 禁拖拉
    canvas.addEventListener('dragstart', e => e.preventDefault());
  </script>

</body>
</html>
