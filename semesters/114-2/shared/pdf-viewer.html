<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教材檢視 ｜ 嵌入式電腦視覺系統</title>
  <link rel="stylesheet" href="css/course.css">
  <!-- GA + 翻頁事件 -->
  <script src="js/analytics.js"></script>
  <!-- PDF.js library 改放本機,避免 Edge Tracking Prevention 與 CDN 不穩問題 -->
  <script src="pdfjs/pdf.min.js"></script>
  <style>
    body { background: #1a2435; margin: 0; padding: 0; }
    .viewer-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #132033;
      color: #fff;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid #2c3e50;
    }
    .viewer-title {
      font-weight: 700;
      font-size: 15px;
      color: #d9e5ef;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 50vw;
    }
    .viewer-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .vbtn {
      background: #1f2f47;
      color: #d9e5ef;
      border: 1px solid #2c4263;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      min-height: 32px;
    }
    .vbtn:hover { background: #2c4263; }
    .vbtn:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-indicator {
      color: #b7d7d7;
      font-size: 14px;
      padding: 0 8px;
    }
    .page-indicator input {
      width: 50px;
      padding: 4px 6px;
      border: 1px solid #2c4263;
      background: #1f2f47;
      color: #fff;
      border-radius: 4px;
      text-align: center;
      font-size: 14px;
    }
    main.viewer-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: calc(100vh - 120px);
    }
    canvas#pdf-canvas {
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      background: #fff;
      max-width: 100%;
      height: auto;
    }
    .loading {
      color: #b7d7d7;
      padding: 40px;
      text-align: center;
    }
    .error {
      color: #ff8a80;
      padding: 40px;
      text-align: center;
      max-width: 600px;
    }
    .error a { color: #7dd3fc; }
    footer.viewer-footer {
      background: #132033;
      color: #b7d7d7;
      padding: 12px 20px;
      text-align: center;
      font-size: 13px;
      border-top: 1px solid #2c3e50;
    }
    @media (max-width: 720px) {
      .viewer-title { max-width: 100%; flex-basis: 100%; }
      .viewer-controls { flex-basis: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="viewer-bar">
    <div class="viewer-title" id="filename">載入中...</div>
    <div class="viewer-controls">
      <button class="vbtn" id="prev" title="上一頁 (←)">← 上一頁</button>
      <span class="page-indicator">
        <input type="number" id="page-input" min="1" value="1"> / <span id="page-count">-</span>
      </span>
      <button class="vbtn" id="next" title="下一頁 (→)">下一頁 →</button>
      <button class="vbtn" id="zoom-out" title="縮小">−</button>
      <button class="vbtn" id="zoom-in" title="放大">+</button>
      <button class="vbtn" id="fit-width" title="符合寬度">⇔ 符合寬度</button>
    </div>
  </div>

  <main class="viewer-main">
    <div id="content" class="loading">⏳ 載入 PDF 中...</div>
    <canvas id="pdf-canvas" style="display:none;"></canvas>
  </main>

  <footer class="viewer-footer">
    嵌入式電腦視覺系統 ｜ 114-2 ｜ 本教材限本課程修課學生使用 ｜ 禁止外流
  </footer>

  <script>
  // 全部包進 IIFE 避免 top-level return 錯誤
  (function () {
    const params = new URLSearchParams(location.search);
    const file = params.get('file');
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const content = document.getElementById('content');

    let pdfDoc = null;
    let pageNum = 1;
    let scale = 1.5;
    let isRendering = false;
    let pendingPage = null;

    function showError(html) {
      content.className = 'error';
      content.style.display = 'block';
      canvas.style.display = 'none';
      content.innerHTML = html;
    }

    function setStatus(text) {
      content.innerHTML = text;
    }

    // === 入口 ===
    if (!file) {
      showError('⚠️ 沒有指定檔案 (網址缺少 ?file=... 參數)');
      return;
    }

    const filename = decodeURIComponent(file.split('/').pop());
    document.getElementById('filename').textContent = filename;
    document.title = filename + ' ｜ 教材檢視';

    // file:// 協定:用 <embed> fallback
    if (location.protocol === 'file:') {
      handleFileProtocol();
      return;
    }

    // 確認本機 PDF.js library 有載入
    if (typeof pdfjsLib === 'undefined') {
      showError('❌ PDF.js library 沒載入 (本機檔 <code>shared/pdfjs/pdf.min.js</code>)<br><br>' +
                '請確認 <code>shared/pdfjs/pdf.min.js</code> 與 <code>pdf.worker.min.js</code> 存在。<br><br>' +
                '<a href="' + file + '" target="_blank">改用瀏覽器直接開啟 PDF</a>');
      return;
    }

    // 設定 worker (也用本機檔)
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';

    setStatus('⏳ 開始載入 PDF...');

    // 8 秒 timeout
    let timedOut = false;
    const loadTimeout = setTimeout(function () {
      timedOut = true;
      showError('❌ PDF 載入逾時 (8 秒)<br><br>' +
                '<a href="' + file + '" target="_blank">改用瀏覽器直接開啟 PDF</a>');
    }, 8000);

    pdfjsLib.getDocument(file).promise.then(function (pdf) {
      if (timedOut) return;
      clearTimeout(loadTimeout);
      pdfDoc = pdf;
      document.getElementById('page-count').textContent = pdf.numPages;
      document.getElementById('page-input').max = pdf.numPages;
      content.style.display = 'none';
      canvas.style.display = 'block';
      fitWidth();
    }).catch(function (err) {
      if (timedOut) return;
      clearTimeout(loadTimeout);
      console.error('PDF load error:', err);
      showError('❌ 無法載入 PDF<br><br><code>' + (err.message || err) + '</code><br><br>' +
                '<a href="' + file + '" target="_blank">改用瀏覽器直接開啟 PDF</a>');
    });

    // === 函式定義 ===

    function handleFileProtocol() {
      document.querySelector('.viewer-controls').style.display = 'none';
      content.style.display = 'none';
      canvas.style.display = 'none';
      const main = document.querySelector('main.viewer-main');
      main.style.padding = '0';

      const embed = document.createElement('embed');
      embed.src = file + '#toolbar=0&navpanes=0';
      embed.type = 'application/pdf';
      embed.style.cssText = 'width:100%; height:calc(100vh - 110px); border:0;';
      main.appendChild(embed);

      const notice = document.createElement('div');
      notice.style.cssText = 'background:#fff8e6; color:#4f3b13; padding:10px 18px; border-bottom:1px solid #e0c068; font-size:13px; text-align:center;';
      notice.innerHTML = '⚠️ 偵測到 <code>file://</code> 本地開啟 — 使用瀏覽器內建 PDF viewer (Layer 1 失效)。<br>' +
                        '完整測試請跑 <code>python -m http.server 8000</code> 然後開 <code>http://localhost:8000/</code>';
      document.body.insertBefore(notice, document.querySelector('.viewer-bar').nextSibling);
    }

    function renderPage(num) {
      if (isRendering) {
        pendingPage = num;
        return;
      }
      isRendering = true;
      pdfDoc.getPage(num).then(function (page) {
        const viewport = page.getViewport({ scale: scale });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function () {
          isRendering = false;
          document.getElementById('page-input').value = num;

          // === GA 追蹤翻頁 ===
          if (window.courseTrack) {
            window.courseTrack('pdf_page_view', {
              pdf_file: filename,
              page_number: num,
              total_pages: pdfDoc.numPages
            });
          }

          if (pendingPage !== null) {
            const p = pendingPage;
            pendingPage = null;
            renderPage(p);
          }
        });
      });
    }

    function goPrev() {
      if (pdfDoc && pageNum > 1) { pageNum--; renderPage(pageNum); }
    }
    function goNext() {
      if (pdfDoc && pageNum < pdfDoc.numPages) { pageNum++; renderPage(pageNum); }
    }
    function zoomIn() { if (pdfDoc) { scale *= 1.2; renderPage(pageNum); } }
    function zoomOut() { if (pdfDoc) { scale /= 1.2; renderPage(pageNum); } }
    function fitWidth() {
      if (!pdfDoc) return;
      pdfDoc.getPage(pageNum).then(function (page) {
        const viewport = page.getViewport({ scale: 1 });
        const main = document.querySelector('main.viewer-main');
        scale = (main.clientWidth - 40) / viewport.width;
        renderPage(pageNum);
      });
    }

    // === 事件綁定 ===
    document.getElementById('prev').addEventListener('click', goPrev);
    document.getElementById('next').addEventListener('click', goNext);
    document.getElementById('zoom-in').addEventListener('click', zoomIn);
    document.getElementById('zoom-out').addEventListener('click', zoomOut);
    document.getElementById('fit-width').addEventListener('click', fitWidth);

    document.getElementById('page-input').addEventListener('change', function (e) {
      const n = parseInt(e.target.value);
      if (pdfDoc && n >= 1 && n <= pdfDoc.numPages) {
        pageNum = n;
        renderPage(pageNum);
      }
    });

    document.addEventListener('keydown', function (e) {
      if (!pdfDoc) return;
      if (document.activeElement.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goPrev(); }
      else if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); goNext(); }
      else if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomIn(); }
      else if (e.key === '-') { e.preventDefault(); zoomOut(); }
    });

    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    canvas.addEventListener('dragstart', function (e) { e.preventDefault(); });
  })();
  </script>

</body>
</html>
